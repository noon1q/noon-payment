<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نون الفؤاد - اختر باقتك</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f7f7f7; text-align: center; padding: 20px; }
        .header { background: #feee00; padding: 20px; border-radius: 10px; margin-bottom: 30px; font-weight: bold; font-size: 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .package-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
        .package-card:hover { transform: translateY(-5px); border: 2px solid #feee00; }
        .price { color: #388e3c; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">نون الفؤاد - العروض الحصرية</div>
    <h3>اختر الباقة المناسبة لك:</h3>
    <div class="grid">
        <div class="package-card" onclick="window.location.href='payment.html'">
            <h4>باقة التوفير 1</h4>
            <p class="price">100 ريال</p>
        </div>
        <div class="package-card" onclick="window.location.href='payment.html'">
            <h4>باقة التوفير 2</h4>
            <p class="price">200 ريال</p>
        </div>
        </div>
</body>
</html>
