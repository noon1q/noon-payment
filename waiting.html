<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نون الفؤاد - العروض الحصرية</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #feee00; /* لون نون الأصفر */
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .card {
            border: 2px solid #000;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            background: #fff;
        }
        .card:hover { background: #f0f0f0; }
        .btn {
            background-color: #000;
            color: #fff;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .hidden { display: none; }
        .payment-option {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            font-size: 20px;
            border: 2px solid #000;
            border-radius: 10px;
            background: #fff;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .coupon-info {
            background: #f9f9f9;
            padding: 10px;
            border: 1px dashed #000;
            margin-bottom: 15px;
            text-align: left;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="step1" class="container">
        <h1>نون الفؤاد - العروض الحصرية</h1>
        <p>اختر الباقة المناسبة لك:</p>
        <div class="card" onclick="showStep(2)">باقة التوفير 100</div>
        <div class="card" onclick="showStep(2)">باقة التوفير 200</div>
        <div class="card" onclick="showStep(2)">باقة التوفير 300</div>
        <div class="card" onclick="showStep(2)">الباقة الفضية 400</div>
        <div class="card" onclick="showStep(2)">الباقة الذهبية 500</div>
        <div class="card" onclick="showStep(2)">الباقة الماسية 1000</div>
    </div>

    <div id="step2" class="container hidden">
        <h1>اختر وسيلة الدفع</h1>
        <button class="payment-option" onclick="showStep(3)">إضافة بطاقة مدى / فيزا</button>
        <button class="payment-option" onclick="showStep(4)">إدخال قسيمة نون</button>
        <button class="btn" style="background: #666;" onclick="showStep(1)">رجوع</button>
    </div>

    <div id="step3" class="container hidden">
        <h1>بيانات البطاقة البنكية</h1>
        <input type="text" placeholder="رقم البطاقة">
        <div style="display: flex; gap: 10px;">
            <input type="text" placeholder="MM/YY">
            <input type="text" placeholder="CVV">
        </div>
        <input type="text" placeholder="اسم حامل البطاقة">
        <button class="btn" onclick="alert('تم استلام الطلب، جاري المعالجة...')">تأكيد الدفع</button>
        <button class="btn" style="background: #666;" onclick="showStep(2)">رجوع</button>
    </div>

    <div id="step4" class="container hidden">
        <div class="coupon-info">
            رقم القسيمة: NOON-2024-XP<br>
            الرمز (PIN): 8899
        </div>
        <h1>إدخال قسيمة نون</h1>
        <input type="text" id="couponNum" placeholder="رقم القسيمة">
        <input type="text" id="couponPin" placeholder="الرمز (PIN)">
        <button class="btn" onclick="processCoupon()">تأكيد القسيمة</button>
        <button class="btn" style="background: #666;" onclick="showStep(2)">رجوع</button>
    </div>

    <script>
        function showStep(step) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step4').classList.add('hidden');
            
            document.getElementById('step' + step).classList.remove('hidden');
        }

        function processCoupon() {
            const num = document.getElementById('couponNum').value;
            const pin = document.getElementById('couponPin').value;
            if(num && pin) {
                alert('تم التحقق من القسيمة بنجاح!');
            } else {
                alert('يرجى إدخال البيانات كاملة');
            }
        }
    </script>
</body>
</html>
